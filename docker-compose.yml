services:
  api:
    build: .
    container_name: storefront_api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:${{ secrets.DATABASE_PASSWORD }}@localhost:5432/storefront
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      PYTHONPATH: /app
      DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
      DATABASE_USERNAME: postgres
      DATABASE_NAME: storefront
      DATABASE_HOSTNAME: db
      DATABASE_PORT: 5432
    depends_on:
      db:
        condition: service_healthy  # Ensures Postgres is accepting connections first
    volumes:
      - .:/app

  db:
    image: postgres:15-alpine
    container_name: storefront_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
      POSTGRES_DB: storefront
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d storefront"]
      interval: 3s
      timeout: 3s
      retries: 5